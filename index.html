<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الملكة زهراء 👑</title>
  
  <!-- خطوط ملكية وكلاسيكية حديثة -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-deep: #050505;
      --surface-dark: #111111;
      --gold-premium: #C5A059;
      --gold-muted: #8A733F;
      --text-main: #EAEAEA;
      --text-muted: #888888;
      --border-thin: rgba(197, 160, 89, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-deep);
      background-image: radial-gradient(circle at 50% 0%, #1a1712 0%, var(--bg-deep) 70%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    /* العناوين الكلاسيكية */
    h1, h2, .classic-text {
      font-family: 'Amiri', serif;
      font-weight: normal;
    }

    .gold-accent {
      color: var(--gold-premium);
    }

    /* الشاشات */
    .screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1), visibility 1s;
      padding: 20px;
    }

    .screen-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* شاشة الدخول الفاخرة */
    .auth-container {
      text-align: center;
      width: 100%;
      max-width: 350px;
    }

    .crown-icon {
      font-size: 2.5rem;
      margin-bottom: 20px;
      color: var(--gold-premium);
      opacity: 0.9;
    }

    .auth-container h2 {
      font-size: 2.2rem;
      margin-bottom: 40px;
      letter-spacing: 1px;
    }

    .input-premium {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--gold-muted);
      color: var(--text-main);
      font-size: 1.2rem;
      text-align: center;
      padding: 10px 0;
      outline: none;
      transition: all 0.3s ease;
      font-family: 'Tajawal', sans-serif;
    }

    .input-premium:focus {
      border-bottom: 1px solid var(--gold-premium);
    }

    .input-premium::placeholder {
      color: #444;
    }

    .btn-premium {
      background: transparent;
      border: 1px solid var(--gold-muted);
      color: var(--gold-premium);
      padding: 12px 40px;
      font-size: 1.1rem;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 40px;
      transition: all 0.4s ease;
      font-family: 'Tajawal', sans-serif;
      letter-spacing: 0.5px;
    }

    .btn-premium:hover {
      background: var(--gold-premium);
      color: var(--bg-deep);
    }

    /* الواجهة الرئيسية */
    #main-realm {
      width: 100%;
      max-width: 800px;
      padding: 60px 20px 120px;
      display: none;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transform: translateY(20px);
      transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #main-realm.active {
      display: flex;
      opacity: 1;
      transform: translateY(0);
    }

    .header-title {
      font-size: 2.8rem;
      margin-bottom: 60px;
      text-align: center;
    }

    /* مشغل الأسطوانة (Turntable) الفاخر */
    .turntable-base {
      background: var(--surface-dark);
      border: 1px solid var(--border-thin);
      border-radius: 12px;
      padding: 30px;
      width: 100%;
      max-width: 400px;
      position: relative;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
      margin-bottom: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .turntable-deck {
      position: relative;
      width: 280px;
      height: 280px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 30px;
      border-radius: 50%;
      background: #0a0a0a;
      box-shadow: inset 0 0 20px rgba(0,0,0,1);
    }

    /* الأسطوانة */
    .vinyl-record {
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: linear-gradient(135deg, #111 20%, #1a1a1a 50%, #111 80%);
      box-shadow: 0 0 0 2px #000, 0 5px 15px rgba(0,0,0,0.5);
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      /* خطوط الأسطوانة */
      background-image: repeating-radial-gradient(
        #111 0, 
        #111 2px, 
        #181818 3px, 
        #111 4px
      );
      transition: transform 0.1s linear;
    }

    .vinyl-label {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #4a1515; /* لون خمري كلاسيكي */
      border: 2px solid var(--gold-premium);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .vinyl-label span {
      font-family: 'Amiri', serif;
      color: var(--gold-premium);
      font-size: 1.1rem;
    }

    .vinyl-hole {
      position: absolute;
      width: 12px;
      height: 12px;
      background: #000;
      border-radius: 50%;
      border: 1px solid #333;
    }

    /* عصا التشغيل (Tonearm) المعالجة هندسياً */
    .tonearm-container {
      position: absolute;
      top: 15px;
      right: 15px; /* ثابتة على اليمين بغض النظر عن اتجاه النص */
      width: 120px;
      height: 160px;
      z-index: 5;
      /* النقطة الدقيقة للدوران */
      transform-origin: 25px 25px;
      transform: rotate(-20deg); /* وضع السكون (إيقاف) */
      transition: transform 0.6s cubic-bezier(0.65, 0, 0.35, 1);
      pointer-events: none;
    }

    /* حالة التشغيل (الذراع تتحرك نحو الأسطوانة) */
    .tonearm-container.playing {
      transform: rotate(22deg);
    }

    .tonearm-pivot {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, #ddd, #888);
      border-radius: 50%;
      border: 2px solid #222;
      box-shadow: 0 5px 10px rgba(0,0,0,0.5);
    }

    .tonearm-rod {
      position: absolute;
      top: 25px;
      right: 22px;
      width: 6px;
      height: 130px;
      background: linear-gradient(to right, #aaa, #fff, #888);
      border-radius: 3px;
      box-shadow: -2px 5px 5px rgba(0,0,0,0.5);
    }

    .tonearm-headshell {
      position: absolute;
      bottom: 0;
      right: 15px;
      width: 20px;
      height: 35px;
      background: #111;
      border: 1px solid #333;
      border-radius: 4px;
      transform: rotate(-15deg);
    }

    /* معرض الصور الكلاسيكي */
    .gallery-title {
      font-size: 1.8rem;
      margin-bottom: 40px;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      width: 100%;
    }

    .photo-frame {
      aspect-ratio: 3/4;
      background: var(--surface-dark);
      border: 1px solid var(--border-thin);
      padding: 8px;
      border-radius: 4px;
      transition: filter 0.5s ease, border-color 0.5s ease;
      filter: grayscale(30%);
    }

    .photo-frame:hover {
      filter: grayscale(0%);
      border-color: var(--gold-premium);
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .placeholder-box {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #0a0a0a;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-family: 'Tajawal', sans-serif;
    }

    /* زر الرسالة المنبثق */
    .message-trigger {
      position: fixed;
      bottom: 40px;
      right: 40px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: transparent;
      border: 1px solid var(--gold-premium);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 50;
      transition: all 0.3s ease;
      background-color: rgba(5,5,5,0.8);
      backdrop-filter: blur(5px);
    }

    .message-trigger:hover {
      background: var(--gold-premium);
    }

    .message-trigger svg {
      width: 20px;
      height: 20px;
      fill: var(--gold-premium);
      transition: fill 0.3s ease;
    }

    .message-trigger:hover svg {
      fill: var(--bg-deep);
    }

    /* النافذة المنبثقة (Modal) */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.5s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .classic-poem {
      text-align: center;
      padding: 40px;
      max-width: 500px;
      border: 1px solid var(--border-thin);
      background: var(--surface-dark);
      border-radius: 8px;
      transform: translateY(20px);
      transition: transform 0.5s ease;
    }

    .modal-overlay.active .classic-poem {
      transform: translateY(0);
    }

    .poem-lines {
      font-size: 1.6rem;
      line-height: 2.4;
      color: var(--text-main);
      margin-bottom: 30px;
    }
  </style>
</head>
<body>

  <!-- شاشة الدخول -->
  <div id="auth-screen" class="screen">
    <div class="auth-container">
      <div class="crown-icon classic-text">♛</div>
      <h2 class="classic-text">مملكة زهراء</h2>
      <input type="password" id="passInput" class="input-premium" placeholder="كلمة المرور">
      <div id="errorMsg" style="color:#a83232; margin-top:15px; font-size:0.9rem; min-height:20px;"></div>
      <button class="btn-premium" onclick="authenticate()">دخول</button>
    </div>
  </div>

  <!-- الواجهة الرئيسية -->
  <div id="main-realm">
    <h1 class="header-title classic-text gold-accent">صاحبة الجلالة، زهراء</h1>

    <!-- مشغل الأسطوانة الكلاسيكي الفاخر -->
    <div class="turntable-base">
      <div class="turntable-deck">
        
        <!-- الذراع (Tonearm) -->
        <div class="tonearm-container" id="tonearm">
          <div class="tonearm-pivot"></div>
          <div class="tonearm-rod"></div>
          <div class="tonearm-headshell"></div>
        </div>

        <!-- الأسطوانة (Vinyl) -->
        <div class="vinyl-record" id="vinyl">
          <div class="vinyl-label">
            <span class="classic-text">زهراء</span>
          </div>
          <div class="vinyl-hole"></div>
        </div>
        
      </div>

      <!-- ملف الصوت -->
      <audio id="mainAudio" src="song.mp3" loop></audio>

      <!-- زر التشغيل العصري -->
      <button class="btn-premium" id="playBtn" style="margin-top: 0;" onclick="toggleAudio()">
        تشغيل الموسيقى
      </button>
    </div>

    <!-- المعرض -->
    <h2 class="gallery-title classic-text">ذكريات خالدة</h2>
    <div class="gallery-grid">
      <div class="photo-frame">
        <img src="photo1.jpg" onerror="this.outerHTML='<div class=\\'placeholder-box\\'>صورة 1<br><span style=\\'font-size:0.7rem; color:#666;\\'>photo1.jpg</span></div>'">
      </div>
      <div class="photo-frame">
        <img src="photo2.jpg" onerror="this.outerHTML='<div class=\\'placeholder-box\\'>صورة 2<br><span style=\\'font-size:0.7rem; color:#666;\\'>photo2.jpg</span></div>'">
      </div>
      <div class="photo-frame">
        <img src="photo3.jpg" onerror="this.outerHTML='<div class=\\'placeholder-box\\'>صورة 3<br><span style=\\'font-size:0.7rem; color:#666;\\'>photo3.jpg</span></div>'">
      </div>
      <div class="photo-frame">
        <img src="photo4.jpg" onerror="this.outerHTML='<div class=\\'placeholder-box\\'>صورة 4<br><span style=\\'font-size:0.7rem; color:#666;\\'>photo4.jpg</span></div>'">
      </div>
    </div>
  </div>

  <!-- زر الرسالة (أيقونة رسالة بسيطة وفاخرة) -->
  <div class="message-trigger" id="msgBtn" style="display:none;" onclick="toggleMessage()">
    <svg viewBox="0 0 24 24">
      <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
    </svg>
  </div>

  <!-- نافذة الشعر الكلاسيكي -->
  <div class="modal-overlay" id="messageModal" onclick="toggleMessage()">
    <div class="classic-poem" onclick="event.stopPropagation()">
      <div class="crown-icon classic-text" style="font-size: 2rem;">♛</div>
      <div class="poem-lines classic-text">
        يا مُنيةَ الرُّوحِ يا زهراءُ يا أملي<br>
        يا زهرةَ الحُبِّ في روضي وفي مُقلي<br><br>
        أسلمتُ قلبي لعينيكِ التي سحرتْ<br>
        فأنتِ نبضي، وأنتِ السِّحرُ في غزلي
      </div>
      <button class="btn-premium" style="margin-top: 10px; padding: 8px 30px; font-size: 1rem;" onclick="toggleMessage()">إغلاق</button>
    </div>
  </div>

  <script>
    // 1. نظام الدخول
    function authenticate() {
      const pass = document.getElementById('passInput').value;
      if (pass === 'ZAHRAbnty') {
        document.getElementById('auth-screen').classList.add('screen-hidden');
        setTimeout(() => {
          document.getElementById('main-realm').classList.add('active');
          document.getElementById('msgBtn').style.display = 'flex';
        }, 800); // تأخير بسيط لدخول دراماتيكي
      } else {
        document.getElementById('errorMsg').textContent = 'الرمز غير صحيح';
      }
    }

    // 2. منطق المشغل الدقيق (لا يوجد تعارض بعد الآن)
    const audio = document.getElementById('mainAudio');
    const vinyl = document.getElementById('vinyl');
    const tonearm = document.getElementById('tonearm');
    const playBtn = document.getElementById('playBtn');
    
    let spinAnimation;
    let rotationAngle = 0;

    // دالة لتدوير الأسطوانة بشكل ناعم باستخدام requestAnimationFrame
    function rotateVinyl() {
      rotationAngle += 1; // سرعة الدوران
      vinyl.style.transform = `rotate(${rotationAngle}deg)`;
      spinAnimation = requestAnimationFrame(rotateVinyl);
    }

    function toggleAudio() {
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    }

    // ربط الحركة بالصوت مباشرة لضمان عدم التعارض
    audio.addEventListener('play', () => {
      tonearm.classList.add('playing');
      playBtn.textContent = 'إيقاف الموسيقى';
      playBtn.style.color = '#fff';
      
      // نبدأ الدوران بعد أن تصل العصا (تأخير بسيط يتوافق مع حركة CSS)
      setTimeout(() => {
        if(!audio.paused) {
           cancelAnimationFrame(spinAnimation);
           rotateVinyl();
        }
      }, 500); 
    });

    audio.addEventListener('pause', () => {
      tonearm.classList.remove('playing');
      playBtn.textContent = 'تشغيل الموسيقى';
      playBtn.style.color = 'var(--gold-premium)';
      
      // إيقاف الدوران فوراً
      cancelAnimationFrame(spinAnimation);
    });

    // 3. النافذة المنبثقة
    function toggleMessage() {
      const modal = document.getElementById('messageModal');
      modal.classList.toggle('active');
    }
  </script>
</body>
</html>
