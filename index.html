<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الملكة زهراء 👑</title>
  
  <!-- الخطوط الملكية -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,700;1,400&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold-royal: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
      --gold-pure: #d4af37;
      --gold-glow: rgba(212, 175, 55, 0.5);
      --ruby-dark: #1a030b;
      --glass-dark: rgba(12, 5, 9, 0.75);
      --glass-border: rgba(212, 175, 55, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
      user-select: none;
    }

    body {
      background-color: #030104;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* خلفية الفخامة التفاعلية */
    .bg-gradient {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 20%, #2e0817 0%, #0d0207 50%, #020003 100%);
      z-index: -2;
    }

    canvas#particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }

    /* التأثير الزجاجي الفاخر */
    .luxury-glass {
      background: var(--glass-dark);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-radius: 30px;
      border: 1.5px solid var(--glass-border);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9), 
                  inset 0 1px 1px rgba(255, 245, 183, 0.3),
                  0 0 30px rgba(212, 175, 55, 0.15);
      position: relative;
    }

    /* النص الذهبي المضيء */
    .gold-text {
      background: var(--gold-royal);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
    }

    /* الشاشات */
    .screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 20px;
    }

    .screen-hidden {
      opacity: 0;
      visibility: hidden;
      transform: scale(0.95);
      pointer-events: none;
    }

    /* 1. قفل المملكة السري */
    .auth-card {
      width: 100%;
      max-width: 400px;
      padding: 50px 35px;
      text-align: center;
    }

    .crown-glow {
      font-size: 4rem;
      margin-bottom: 15px;
      filter: drop-shadow(0 0 20px var(--gold-pure));
      animation: crownFloat 3s infinite ease-in-out;
    }

    @keyframes crownFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .auth-card h2 {
      font-family: 'Aref Ruqaa', serif;
      font-size: 2.5rem;
      margin-bottom: 30px;
    }

    .pass-input {
      width: 100%;
      padding: 16px 20px;
      background: rgba(0, 0, 0, 0.6);
      border: 1.5px solid var(--gold-pure);
      border-radius: 50px;
      color: #fff;
      font-size: 1.2rem;
      text-align: center;
      outline: none;
      transition: all 0.4s;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
    }

    .pass-input:focus {
      box-shadow: 0 0 25px var(--gold-glow), inset 0 0 15px rgba(212, 175, 55, 0.3);
    }

    .luxury-btn {
      background: var(--gold-royal);
      color: #0d0307;
      font-size: 1.25rem;
      font-weight: 900;
      padding: 16px 45px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 25px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(179, 135, 40, 0.4);
      transition: all 0.4s ease;
    }

    .luxury-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 15px 40px rgba(212, 175, 55, 0.7);
    }

    /* 2. شاشة الترحيب الملكية */
    .welcome-title {
      font-family: 'Aref Ruqaa', serif;
      font-size: 3.5rem;
      text-align: center;
      margin-bottom: 15px;
    }

    .welcome-sub {
      font-size: 1.3rem;
      color: #e0d0c0;
      margin-bottom: 40px;
      text-align: center;
    }

    /* 3. الواجهة الرئيسية */
    #main-realm {
      width: 100%;
      max-width: 900px;
      padding: 40px 20px 100px;
      display: none;
      flex-direction: column;
      align-items: center;
      z-index: 10;
    }

    #main-realm.active {
      display: flex;
    }

    .realm-title {
      font-family: 'Aref Ruqaa', serif;
      font-size: 3.2rem;
      margin-bottom: 40px;
    }

    /* مشغل الأسطوانة */
    .player-deck {
      width: 100%;
      max-width: 450px;
      padding: 40px 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 50px;
    }

    .vinyl-stage {
      position: relative;
      width: 290px;
      height: 290px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 35px;
    }

    .vinyl-disc {
      width: 270px;
      height: 270px;
      border-radius: 50%;
      background: repeating-radial-gradient(#111, #111 3px, #1a1a1a 4px, #111 5px);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), 0 0 0 6px rgba(212, 175, 55, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      animation: spinRecord 4s linear infinite paused;
    }

    .vinyl-disc.spinning {
      animation-play-state: running;
    }

    @keyframes spinRecord {
      100% { transform: rotate(360deg); }
    }

    .vinyl-core {
      width: 95px;
      height: 95px;
      border-radius: 50%;
      background: radial-gradient(circle, #800a22, #33000b);
      border: 3px solid var(--gold-pure);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 0 10px #000;
    }

    .vinyl-core span {
      font-family: 'Aref Ruqaa', serif;
      color: #fff;
      font-size: 1.2rem;
    }

    /* عصا الأسطوانة الدقيقة */
    .tonearm-box {
      position: absolute;
      top: -10px;
      left: 20px;
      width: 80px;
      height: 170px;
      pointer-events: none;
      z-index: 15;
      transform-origin: 25px 25px;
      transform: rotate(-32deg);
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .tonearm-box.active {
      transform: rotate(4deg); /* تستقر تماماً على الأسطوانة */
    }

    .tonearm-base {
      width: 50px;
      height: 50px;
      background: var(--gold-royal);
      border-radius: 50%;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.8);
    }

    .tonearm-arm {
      width: 6px;
      height: 135px;
      background: linear-gradient(to right, #e6c875, #ffffff, #996e19);
      position: absolute;
      top: 20px;
      left: 22px;
      border-radius: 3px;
    }

    .tonearm-head {
      width: 18px;
      height: 28px;
      background: #222;
      border: 1px solid var(--gold-pure);
      position: absolute;
      bottom: -8px;
      left: 16px;
      border-radius: 3px;
    }

    /* معرض الصور */
    .section-title {
      font-family: 'Aref Ruqaa', serif;
      font-size: 2.3rem;
      margin-bottom: 30px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      width: 100%;
    }

    @media (max-width: 600px) {
      .gallery-grid { grid-template-columns: 1fr; }
    }

    .photo-card {
      padding: 10px;
      border-radius: 20px;
      aspect-ratio: 4/5;
      overflow: hidden;
      transition: all 0.5s ease;
    }

    .photo-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 35px var(--gold-glow);
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 14px;
      display: block;
    }

    .photo-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed var(--gold-pure);
      border-radius: 14px;
      color: var(--gold-pure);
    }

    /* زر الرسالة العائم والنافذة */
    .floating-poem-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: var(--glass-dark);
      border: 1.5px solid var(--gold-pure);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.8rem;
      cursor: pointer;
      box-shadow: 0 10px 25px var(--gold-glow);
      z-index: 99;
      transition: all 0.4s;
    }

    .floating-poem-btn:hover {
      transform: scale(1.15) rotate(15deg);
    }

    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s;
    }

    .modal-backdrop.open {
      opacity: 1;
      visibility: visible;
    }

    .poem-box {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      width: 90%;
      max-width: 500px;
      padding: 40px 30px;
      text-align: center;
      z-index: 1001;
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .poem-box.open {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
    }

    .poem-text {
      font-family: 'Amiri', serif;
      font-size: 1.6rem;
      line-height: 2.2;
      color: #fff;
      margin-bottom: 25px;
    }
  </style>
</head>
<body>

  <div class="bg-gradient"></div>
  <canvas id="particles"></canvas>

  <!-- 1. شاشة الرمز السري -->
  <div id="screen-auth" class="screen">
    <div class="auth-card luxury-glass">
      <div class="crown-glow">👑</div>
      <h2 class="gold-text">مملكة زهراء</h2>
      <input type="password" id="passInput" class="pass-input" placeholder="أدخلي كلمة السر">
      <div id="errorText" style="color:#ff4757; margin-top:12px; font-size:0.9rem; min-height:20px;"></div>
      <button class="luxury-btn" onclick="checkPassword()">دخول للمملكة</button>
    </div>
  </div>

  <!-- 2. شاشة الترحيب -->
  <div id="screen-welcome" class="screen screen-hidden">
    <h1 class="welcome-title gold-text">أهلاً بكِ في عوالمكِ الفاخرة</h1>
    <p class="welcome-sub">صُممت كل التفاصيل بعناية لأجلكِ يا ملكتي ❤️</p>
    <button class="luxury-btn" style="width:auto; padding: 18px 60px;" onclick="startRealm()">افتحي المملكة 👑</button>
  </div>

  <!-- 3. الواجهة الرئيسية -->
  <div id="main-realm">
    <h1 class="realm-title gold-text">ملكتي زهراء ✨</h1>

    <!-- مشغل الأسطوانة -->
    <div class="player-deck luxury-glass">
      <div class="vinyl-stage">
        <div class="tonearm-box" id="tonearm">
          <div class="tonearm-base"></div>
          <div class="tonearm-arm"></div>
          <div class="tonearm-head"></div>
        </div>
        <div class="vinyl-disc" id="vinyl">
          <div class="vinyl-core">
            <span>زهراء</span>
          </div>
        </div>
      </div>

      <!-- الصوت -->
      <audio id="mainAudio" src="song.mp3" loop></audio>

      <!-- زر التشغيل -->
      <button class="luxury-btn" id="playBtn" onclick="togglePlay()" style="width: auto; padding: 14px 40px;">
        <span id="btnIcon">▶</span> <span id="btnText">تشغيل الأغنية</span>
      </button>
    </div>

    <!-- معرض الصور -->
    <h2 class="section-title gold-text">أجمل الذكريات 📸</h2>
    <div class="gallery-grid">
      <div class="photo-card luxury-glass">
        <img src="photo1.jpg" alt="زهراء" onerror="imgError(this, 1)">
      </div>
      <div class="photo-card luxury-glass">
        <img src="photo2.jpg" alt="زهراء" onerror="imgError(this, 2)">
      </div>
      <div class="photo-card luxury-glass">
        <img src="photo3.jpg" alt="زهراء" onerror="imgError(this, 3)">
      </div>
      <div class="photo-card luxury-glass">
        <img src="photo4.jpg" alt="زهراء" onerror="imgError(this, 4)">
      </div>
    </div>
  </div>

  <!-- أيقونة الرسالة والشعر -->
  <div class="floating-poem-btn" id="poemBtn" style="display:none;" onclick="togglePoem()">💌</div>

  <div class="modal-backdrop" id="backdrop" onclick="togglePoem()"></div>
  <div class="poem-box luxury-glass" id="poemModal">
    <div class="poem-text">
      يا مُنيةَ الرُّوحِ يا زهراءُ يا أملي<br>
      يا زهرةَ الحُبِّ في روضي وفي مُقلي<br><br>
      أسلمتُ قلبي لعينيكِ التي سحرتْ<br>
      فأنتِ نبضي، وأنتِ السِّحرُ في غزلي ❤️
    </div>
    <button class="luxury-btn" style="width:auto; padding: 10px 35px; font-size:1rem;" onclick="togglePoem()">إغلاق</button>
  </div>

  <script>
    /* 1. محرك خلفية القلوب والذهب */
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + 20;
        this.size = Math.random() * 14 + 6;
        this.speedY = Math.random() * 1.2 + 0.4;
        this.opacity = Math.random() * 0.7 + 0.3;
        this.isHeart = Math.random() > 0.4;
      }
      update() {
        this.y -= this.speedY;
        if (this.y < -20) this.reset();
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.opacity;
        if (this.isHeart) {
          ctx.fillStyle = '#ff2a6d';
          ctx.font = `${this.size}px serif`;
          ctx.fillText('♥', this.x, this.y);
        } else {
          ctx.fillStyle = '#d4af37';
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size / 4, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    for (let i = 0; i < 50; i++) particles.push(new Particle());
    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(loop);
    }
    loop();

    /* 2. التحقق من كلمة السر */
    function checkPassword() {
      const pass = document.getElementById('passInput').value;
      if (pass === 'ZAHRAbnty') {
        document.getElementById('screen-auth').classList.add('screen-hidden');
        document.getElementById('screen-welcome').classList.remove('screen-hidden');
      } else {
        document.getElementById('error-message') || (document.getElementById('errorText').textContent = 'الرمز غير صحيح، حاولي مجدداً يا ملكتي');
      }
    }

    function startRealm() {
      document.getElementById('screen-welcome').classList.add('screen-hidden');
      document.getElementById('main-realm').classList.add('active');
      document.getElementById('poemBtn').style.display = 'flex';
      
      // تشغيل الصوت بعد الضغط مباشرة
      const audio = document.getElementById('mainAudio');
      audio.play().catch(e => console.log('Autoplay prevented'));
    }

    /* 3. الحل النهائي لمعالجة خطأ زر التشغيل والعصا */
    const audio = document.getElementById('mainAudio');
    const vinyl = document.getElementById('vinyl');
    const tonearm = document.getElementById('tonearm');
    const btnIcon = document.getElementById('btnIcon');
    const btnText = document.getElementById('btnText');

    function togglePlay() {
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    }

    // ربط الحركة بالحدث الحقيقي للصوت لمنع أي تعارض
    audio.addEventListener('play', () => {
      vinyl.classList.add('spinning');
      tonearm.classList.add('active');
      btnIcon.textContent = '⏸';
      btnText.textContent = 'إيقاف مؤقت';
    });

    audio.addEventListener('pause', () => {
      vinyl.classList.remove('spinning');
      tonearm.classList.remove('active');
      btnIcon.textContent = '▶';
      btnText.textContent = 'تشغيل الأغنية';
    });

    /* 4. معالج عدم وجود صورة */
    function imgError(img, num) {
      img.parentElement.innerHTML = `
        <div class="photo-placeholder">
          <span style="font-size: 2rem;">👑</span>
          <div>صورة ${num}</div>
          <small style="opacity:0.5;">photo${num}.jpg</small>
        </div>
      `;
    }

    /* 5. النافذة المنبثقة للشعر */
    function togglePoem() {
      document.getElementById('backdrop').classList.toggle('open');
      document.getElementById('poemModal').classList.toggle('open');
    }
  </script>
</body>
</html>
